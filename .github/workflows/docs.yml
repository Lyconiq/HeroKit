name: Docs

on:
  release:
    types: [ published ]
  # Guide edits go live without a release. API pages still follow master.
  push:
    branches: [ master ]
    paths: [ 'docs/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the built site to the site branch
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build site
        run: |
          dotnet tool install -g docfx
          docfx docs/docfx.json

      # Vercel serves https://herokit.lyconiq.com from the site branch, which holds only the built site.
      # The branch is rewritten on every run; its history is not kept.
      - name: Publish to the site branch
        working-directory: docs/_site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Without this, Vercel's "Other" preset serves only the public/ folder that docfx creates.
          echo '{ "framework": null, "buildCommand": "", "installCommand": "", "outputDirectory": "." }' > vercel.json
          git init -q -b site
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Site for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
